
services:
  backend:
    build:
      context: ./platform/backend
      dockerfile: Dockerfile
    environment:
      SLM_DB_NAME: ${SLM_DB_NAME:?Set SLM_DB_NAME}
      SLM_DB_USER: ${SLM_DB_USER:?Set SLM_DB_USER}
      SLM_DB_PASSWORD: ${SLM_DB_PASSWORD:?Set SLM_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SLM_DB_NAME:?Set SLM_DB_NAME}
      POSTGRES_USER: ${SLM_DB_USER:?Set SLM_DB_USER}
      POSTGRES_PASSWORD: ${SLM_DB_PASSWORD:?Set SLM_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
